name: Espelhar para sigiloteca (público)

# Toda vez que a branch main deste repositório (sigiloteca-prod) recebe um
# push, empurra o mesmo conteúdo para luizgteixeira/sigiloteca — o
# repositório público usado como vitrine de portfólio, já que este aqui
# (a fonte real de deploy em produção) é privado.

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Espelhar para sigiloteca (sem .github, que é só deste repositório)
        run: |
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mirror de sigiloteca-prod@${GITHUB_SHA}" --allow-empty
          git push "https://x-access-token:${TOKEN}@github.com/luizgteixeira/sigiloteca.git" HEAD:main --force
        env:
          TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
